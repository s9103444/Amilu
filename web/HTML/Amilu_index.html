<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>首頁 - Amilu</title>
    <link rel="stylesheet" href="../CSS/common.css" />
    <link rel="stylesheet" href="../CSS/Amilu_index_style.css" />
    <!-- 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap"
      rel="stylesheet"
    />
    <!-- swiper套件 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@14/swiper-bundle.min.css"
    />
    <!--登入燈箱樣式-->
    <link rel="stylesheet" href="../CSS/login-modal.css" />
    <!--JQ-->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <!-- header.site-header -->
    <header class="site-header">
      <div>
        <a href="Amilu_index.html"
          ><img class="logo" src="../Picture/Logo.png"
        /></a>
        <a href="Amilu_index.html"
          ><img class="logo-pd-mb" src="../Picture/Amilu_logo_small.png"
        /></a>
        <div class="explore-followed">
          <input
            type="radio"
            id="followed"
            name="explore-followed"
            class="hidden-box"
          />
          <label for="followed">已追蹤</label>
          <input
            type="radio"
            id="explore"
            name="explore-followed"
            class="hidden-box"
            checked
          />
          <label for="explore">探索</label>
        </div>
        <div class="explore-followed-pd">
          <select id="explore-followed-pd">
            <option value="">探索</option>
            <option value="">已追蹤</option>
          </select>
        </div>
      </div>

      <div class="amilu-search-bar">
        <img src="../Picture/icon/Type=Search, Color=Gradient.svg" />
        <input type="search" class="search-txt" placeholder="關鍵字搜尋..." />
      </div>

      <div class="site-header-right">
        <div class="description">
          <a class="btn-help-page" href="../HTML/Amilu_Help_page.html">
            網站說明
          </a>
          <a href="#" class="btn-md-red-withicon hidden">
            上傳作品
            <img
              class="icon-upload"
              src="../Picture/icon/icon-upload-orange.png"
            />
          </a>
          <a href="#" class="btn-md-red-withicon-pd">
            <img
              class="icon-upload"
              src="../Picture/icon/icon-upload-orange.png"
            />
          </a>
        </div>
        <section class="btn-before-lg">
          <a href="#" id="web-login">登入</a>
          <a href="#" class="button-md-black">註冊</a>
        </section>
        <section class="btn-after-lg hidden">
          <div class="chat-notice">
            <a class="btn-chat" href="#"
              ><img src="../Picture/icon/chat-black.png" alt="對話通知icon"
            /></a>
          </div>
          <div class="btn-news-notice">
            <a class="btn-news" href="#"
              ><img src="../Picture/icon/notice-black.png" alt="最新消息icon"
            /></a>
          </div>
          <div class="field-user-info">
            <a class="btn-user-info" href="#">
              <div class="info-pic">
                <img src="../Picture/04.jpg" alt="選單頭貼" />
              </div>
              <section class="info-menu-content hidden">
                <div>使用者名稱</div>
                <div>@test_name</div>
              </section>

              <img
                class="icon-slide-down"
                src="../Picture/icon/slide-down-brown.png"
                alt=""
              />
            </a>
            <ul class="menu-user-info hidden">
              <li><a href="#">使用者面板</a></li>
              <li><a href="#">個人專頁</a></li>
              <li>
                <a href="./Amilu_commission_management.html">稿件管理</a>
              </li>
              <li><a href="#">通知中心</a></li>
              <li><a href="./Amilu_Help_page.html">網站說明</a></li>
              <li><a href="#">設定</a></li>
              <li><a id="logout" href="#">登出</a></li>
            </ul>
          </div>
        </section>
      </div>
    </header>

    <div id="nav-bg" style="height: 140px"></div>

    <nav class="category-bar">
      <div class="main-guide-con">
        <button class="main-guide-button">
          <img src="../Picture/icon/Type=Categories, Color=Gradient.svg" />
          <span>全部類別</span>
        </button>
      </div>
      <div class="main-tabs swiper">
        <ul class="chosing-section swiper-wrapper">
          <li class="swiper-slide"><button href="#">插畫</button></li>
          <li class="swiper-slide"><button href="#">Live2D/動態</button></li>
          <li class="swiper-slide"><button href="#">角色立繪</button></li>
          <li class="swiper-slide"><button href="#">頭像/大頭貼</button></li>
          <li class="swiper-slide"><button href="#">2D場景/背景</button></li>
          <li class="swiper-slide"><button href="#">吉祥物設計</button></li>
          <li class="swiper-slide"><button href="#">漫畫/分鏡</button></li>
          <li class="swiper-slide"><button href="#">概念設定</button></li>
          <li class="swiper-slide"><button href="#">場景圖</button></li>
          <li class="swiper-slide"><button href="#">3D 建模</button></li>
          <li class="swiper-slide"><button href="#">周邊製作</button></li>
          <li class="swiper-slide"><button href="#">同人創作</button></li>
          <li class="swiper-slide"><button href="#">原創角色</button></li>
          <li class="swiper-slide"><button href="#">海報／主視覺</button></li>
          <li class="swiper-slide"><button href="#">動圖/GIF</button></li>
          <li class="swiper-slide"><button href="#">PV製作</button></li>
        </ul>
      </div>     
    </nav>

    <div class="sub-section swiper">
      <div class="wrap-sub-section swiper-wrapper">
        <button class="swiper-slide">
          <img
            src="../Picture/Art_work/sub-section-picture/Rectangle 5.png"
            alt=""
          />日系插畫
        </button>
        <button class="swiper-slide">
          <img
            src="../Picture/Art_work/sub-section-picture/Rectangle 4-1.png"
            alt=""
          />美式風格
        </button>
        <button class="swiper-slide">
          <img
            src="../Picture/Art_work/sub-section-picture/Rectangle 4-2.png"
            alt=""
          />韓系畫風
        </button>
        <button class="swiper-slide">
          <img
            src="../Picture/Art_work/sub-section-picture/Rectangle 4-3.png"
            alt=""
          />寫實風格
        </button>
        <button class="swiper-slide">
          <img
            src="../Picture/Art_work/sub-section-picture/Rectangle 4-4.png"
            alt=""
          />Q版風格
        </button>
        <button class="swiper-slide">
          <img
            src="../Picture/Art_work/sub-section-picture/Rectangle 4-5.png"
            alt=""
          />厚塗風格
        </button>
        <button class="swiper-slide">
          <img
            src="../Picture/Art_work/sub-section-picture/Rectangle 4.png"
            alt=""
          />像素插畫
        </button>
        <button class="swiper-slide">
          <img
            src="../Picture/Art_work/sub-section-picture/Rectangle 6.png"
            alt=""
          />柔焦夢幻
        </button>
        <button class="swiper-slide">
          <img
            src="../Picture/Art_work/sub-section-picture/Rectangle 14.png"
            alt=""
          />古風插畫
        </button>
        <button class="swiper-slide">
          <img
            src="../Picture/Art_work/sub-section-picture/Rectangle 7.png"
            alt=""
          />抽象藝術
        </button>
      </div class="swiper-slide">
    </div>

    <div id="lightbox" style="display: none"></div>
    <div class="gallery" id="gallery"></div>
    <div id="beforeLoginBlock"><button class="CTA-login-bottom">登入瀏覽更多</button></div>
    <div id="checkPoint"></div>
    <!-- swiper cdn -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@14/swiper-bundle.min.js"></script>
    <script src="../JS/swiper_index.js"></script>
    <script src="../JS/Amilu.js" defer></script>
    <script src="../JS/Amilu_common.js"></script>
  </body>
</html>
